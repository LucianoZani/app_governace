# Configuração do Databricks App (Streamlit) — deploy MANUAL pelo Databricks.
#
# Instância: Databricks Free Edition (workspace pessoal de teste), 1 warehouse
# serverless único, sem separação real dev/prd — por isso ENVIRONMENT=prd
# (nenhum schema termina em "_dev" nesta conta).

command: ["streamlit", "run", "app.py"]

env:
  # SQL Warehouse usado pela Statement Execution API.
  - name: DATABRICKS_WAREHOUSE_ID
    value: "20dfe5c08c3fa359"

  # false = tudo roda como o service principal do App (sem OBO). Simplifica o
  # primeiro deploy: não precisa configurar User Authorization/scopes no App.
  - name: USE_ON_BEHALF_OF_USER
    value: "false"

  # Ambiente lógico: "dev" mostra/edita só schemas *_dev; "prd" só os de PROD.
  - name: ENVIRONMENT
    value: "prd"

  # Restringe o app a estes catálogos (vazio = todos). Todos os schemas do
  # catálogo continuam disponíveis (respeitando o filtro de ambiente).
  - name: ALLOWED_CATALOGS
    value: "supply_chain,vendas,poc_de_para_materiais_fornecedores"

  # Busca de usuários no nível de CONTA (Account SCIM API) — permite encontrar
  # usuários ainda não provisionados neste workspace (ex.: só existem em DEV).
  # Requer que o SP do App tenha permissão de leitura de usuários na conta
  # (ver docs/04-permissoes.md). Vazio = busca apenas usuários do workspace.
  - name: DATABRICKS_ACCOUNT_ID
    value: ""
  # Host do console de contas (Azure). Só mude se não for Azure Databricks.
  - name: DATABRICKS_ACCOUNT_HOST
    value: "https://accounts.azuredatabricks.net"

  # Cadastros (domínios/sub/stewards/permissões) — dados internos do app,
  # gravados pelo service principal em <CADASTRO_CATALOG>.<CADASTRO_SCHEMA>.
  - name: CADASTRO_CATALOG
    value: "apps"
  - name: CADASTRO_SCHEMA
    value: "governanca_unity_catalog"
  # Admin inicial dos cadastros (semeado se a tabela permissoes estiver vazia).
  - name: SEED_ADMIN_EMAIL
    value: "lucianozaniengenheirodedados@gmail.com"

  # Dashboards AI/BI (Lakeview) não são mais configurados aqui: são cadastrados
  # dentro do app, em Cadastros → Dashboards, vinculados a um Domínio/Sub-domínio.

  # Assistente de IA (painel "Assistente de Governança"). Usa o Unity AI
  # Gateway (system.ai / model service registrado em UC) — não o
  # /serving-endpoints clássico. O SP do app precisa de EXECUTE no model
  # service (ver docs/04-permissoes.md).
  - name: LLM_ENABLED
    value: "true"
  # Nome completo (catalog.schema.name) do model service no AI Gateway.
  - name: LLM_ENDPOINT
    value: "apps.governanca_unity_catalog_prd.assistente_governanca"
